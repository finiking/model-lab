<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PELICAN // OVERDRIVE</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #05080e;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "SF Mono", "JetBrains Mono", "Consolas", "Courier New", monospace;
  }

  #stage-wrapper {
    position: relative;
    width: 100vw;
    height: 56.25vw; /* 16:9 ratio */
    max-height: 100vh;
    max-width: 177.78vh;
    background: #070b12;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(0, 0, 0, 0.95), 0 0 2px rgba(0, 240, 255, 0.25);
  }

  svg#scene {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Minimalist Mecha HUD Overlay */
  .hud-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 2.2% 2.8%;
  }

  .hud-title {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #c5d1de;
    font-size: clamp(11px, 1.05vw, 15px);
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    background: rgba(11, 16, 24, 0.72);
    border-left: 3px solid #ff4d29;
    border-top: 1px solid rgba(197, 209, 222, 0.16);
    border-right: 1px solid rgba(197, 209, 222, 0.16);
    border-bottom: 1px solid rgba(197, 209, 222, 0.16);
    padding: 7px 14px;
    backdrop-filter: blur(4px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }

  .hud-dot {
    width: 7px;
    height: 7px;
    background: #00f0ff;
    box-shadow: 0 0 10px #00f0ff;
    transform: rotate(45deg);
    transition: background 0.2s, box-shadow 0.2s;
  }

  .hud-title.boosting .hud-dot {
    background: #ff4d29;
    box-shadow: 0 0 14px #ff4d29;
  }

  .boost-btn {
    pointer-events: auto;
    cursor: pointer;
    background: linear-gradient(135deg, rgba(20, 28, 40, 0.88) 0%, rgba(11, 16, 24, 0.94) 100%);
    color: #e8eef5;
    border: 1px solid rgba(0, 240, 255, 0.45);
    border-right: 3px solid #00f0ff;
    padding: 8px 18px;
    font-family: inherit;
    font-size: clamp(11px, 1vw, 14px);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(0, 240, 255, 0.08);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }

  .boost-btn:hover {
    border-color: #00f0ff;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.35), inset 0 0 15px rgba(0, 240, 255, 0.2);
    transform: translateY(-1px);
  }

  .boost-btn:active,
  .boost-btn.active {
    background: linear-gradient(135deg, rgba(255, 77, 41, 0.32) 0%, rgba(20, 14, 18, 0.95) 100%);
    border-color: #ff4d29;
    border-right-color: #ff4d29;
    color: #ffffff;
    box-shadow: 0 0 28px rgba(255, 77, 41, 0.55), inset 0 0 18px rgba(255, 77, 41, 0.35);
    transform: translateY(1px);
  }

  .boost-key {
    font-size: 0.78em;
    color: #00f0ff;
    opacity: 0.85;
    padding: 1px 5px;
    border: 1px solid rgba(0, 240, 255, 0.35);
    background: rgba(0, 240, 255, 0.08);
  }

  .boost-btn.active .boost-key {
    color: #ff9e80;
    border-color: rgba(255, 77, 41, 0.6);
    background: rgba(255, 77, 41, 0.2);
  }
</style>
</head>
<body>

<div id="stage-wrapper">
  <!-- Minimalist HUD -->
  <div class="hud-layer">
    <div class="hud-title" id="hudStatus">
      <span class="hud-dot"></span>
      <span>PELICAN // OVERDRIVE</span>
    </div>
    <button class="boost-btn" id="boostBtn" type="button" aria-label="Trigger Overdrive Boost">
      <span>BOOST</span>
      <span class="boost-key">SPACE</span>
    </button>
  </div>

  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Sky & Atmosphere Gradients -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#050811"/>
        <stop offset="48%" stop-color="#0a1222"/>
        <stop offset="82%" stop-color="#111d31"/>
        <stop offset="100%" stop-color="#080d17"/>
      </linearGradient>

      <radialGradient id="cityGlow" cx="55%" cy="72%" r="55%">
        <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.13"/>
        <stop offset="45%" stop-color="#0066ff" stop-opacity="0.05"/>
        <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="roadDeckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#121a26"/>
        <stop offset="15%" stop-color="#0c121b"/>
        <stop offset="60%" stop-color="#080c13"/>
        <stop offset="100%" stop-color="#04060a"/>
      </linearGradient>

      <!-- Ceramic White Mecha Armor Gradients -->
      <linearGradient id="ceramicWhite" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#f7faff"/>
        <stop offset="35%" stop-color="#e5edf6"/>
        <stop offset="75%" stop-color="#c2cfde"/>
        <stop offset="100%" stop-color="#96a7bc"/>
      </linearGradient>

      <linearGradient id="ceramicBevel" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="22%" stop-color="#dce6f2"/>
        <stop offset="85%" stop-color="#b2c2d4"/>
        <stop offset="100%" stop-color="#7e90a6"/>
      </linearGradient>

      <linearGradient id="ceramicShadowed" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#98a8bc"/>
        <stop offset="55%" stop-color="#6e7f94"/>
        <stop offset="100%" stop-color="#485669"/>
      </linearGradient>

      <!-- Gunmetal & Frame Gradients -->
      <linearGradient id="gunmetalDark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#364354"/>
        <stop offset="45%" stop-color="#222b37"/>
        <stop offset="100%" stop-color="#12171f"/>
      </linearGradient>

      <linearGradient id="gunmetalSpec" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#526278"/>
        <stop offset="30%" stop-color="#293342"/>
        <stop offset="70%" stop-color="#181f29"/>
        <stop offset="100%" stop-color="#2f3b4c"/>
      </linearGradient>

      <linearGradient id="farLegDark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4c5b6e"/>
        <stop offset="50%" stop-color="#2c3645"/>
        <stop offset="100%" stop-color="#171d26"/>
      </linearGradient>

      <linearGradient id="carbonFrame" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2e3948"/>
        <stop offset="40%" stop-color="#1b222c"/>
        <stop offset="80%" stop-color="#10151c"/>
        <stop offset="100%" stop-color="#26313f"/>
      </linearGradient>

      <!-- Hazard Orange & Energy Cyan -->
      <linearGradient id="hazardOrange" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff7448"/>
        <stop offset="50%" stop-color="#ff4d29"/>
        <stop offset="100%" stop-color="#b82508"/>
      </linearGradient>

      <linearGradient id="cyanEnergy" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="30%" stop-color="#70f8ff"/>
        <stop offset="75%" stop-color="#00d8ff"/>
        <stop offset="100%" stop-color="#0066ff"/>
      </linearGradient>

      <!-- Semi-Transparent Gular Pouch (Lower Beak) Gradients -->
      <linearGradient id="pouchShellGrad" x1="20%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#1d354d" stop-opacity="0.72"/>
        <stop offset="45%" stop-color="#0b2238" stop-opacity="0.62"/>
        <stop offset="85%" stop-color="#00a2cc" stop-opacity="0.38"/>
        <stop offset="100%" stop-color="#4ceeff" stop-opacity="0.65"/>
      </linearGradient>

      <radialGradient id="pouchCoreGlow" cx="48%" cy="44%" r="52%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
        <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.88"/>
        <stop offset="65%" stop-color="#0077ff" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#002244" stop-opacity="0"/>
      </radialGradient>

      <!-- Thruster Plume Gradients -->
      <linearGradient id="thrusterCyan" x1="100%" y1="50%" x2="0%" y2="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
        <stop offset="22%" stop-color="#78f8ff" stop-opacity="0.95"/>
        <stop offset="55%" stop-color="#00d0ff" stop-opacity="0.7"/>
        <stop offset="85%" stop-color="#ff4d29" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#ff4d29" stop-opacity="0"/>
      </linearGradient>

      <linearGradient id="thrusterOrange" x1="100%" y1="50%" x2="0%" y2="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
        <stop offset="25%" stop-color="#ffae42" stop-opacity="0.92"/>
        <stop offset="65%" stop-color="#ff4d29" stop-opacity="0.65"/>
        <stop offset="100%" stop-color="#990000" stop-opacity="0"/>
      </linearGradient>

      <!-- Ground Shadows & Reflections -->
      <radialGradient id="wheelContactShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000000" stop-opacity="0.92"/>
        <stop offset="55%" stop-color="#020408" stop-opacity="0.65"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="cyanGroundBounce" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.36"/>
        <stop offset="50%" stop-color="#0099ff" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="orangeGroundBounce" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff4d29" stop-opacity="0.45"/>
        <stop offset="50%" stop-color="#ff4d29" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#ff4d29" stop-opacity="0"/>
      </radialGradient>

      <!-- Glow Filters -->
      <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="7" result="blur1"/>
        <feGaussianBlur stdDeviation="16" result="blur2"/>
        <feMerge>
          <feMergeNode in="blur2"/>
          <feMergeNode in="blur1"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <filter id="glowSoft" x="-25%" y="-25%" width="150%" height="150%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Reusable High-Tech Aero Wheel Assembly (Radius = 185) -->
      <g id="aeroWheel">
        <!-- Outer Rubber Tire with bevel -->
        <circle cx="0" cy="0" r="185" fill="none" stroke="#10151d" stroke-width="26"/>
        <circle cx="0" cy="0" r="185" fill="none" stroke="#1f2836" stroke-width="20"/>
        <!-- Tire Tread blocks (rotating with wheel) -->
        <circle cx="0" cy="0" r="195" fill="none" stroke="#090c10" stroke-width="5" stroke-dasharray="14 10"/>
        <!-- Deep Profile Carbon Aero Rim -->
        <circle cx="0" cy="0" r="162" fill="none" stroke="url(#gunmetalDark)" stroke-width="24"/>
        <circle cx="0" cy="0" r="173" fill="none" stroke="#5b6d85" stroke-width="1.5" opacity="0.7"/>
        <circle cx="0" cy="0" r="150" fill="none" stroke="#0d1218" stroke-width="3"/>
        <!-- Rim Hazard & Telemetry Decals (rotate clearly!) -->
        <path d="M 155 -28 A 158 158 0 0 1 155 28" fill="none" stroke="#ff4d29" stroke-width="8"/>
        <path d="M -155 -28 A 158 158 0 0 0 -155 28" fill="none" stroke="#ff4d29" stroke-width="8"/>
        <path d="M -22 -156 A 158 158 0 0 1 22 -156" fill="none" stroke="#00f0ff" stroke-width="5" opacity="0.85"/>
        <path d="M -22 156 A 158 158 0 0 0 22 156" fill="none" stroke="#00f0ff" stroke-width="5" opacity="0.85"/>

        <!-- 6-Pair Bladed Carbon Tri-Spokes + Tension Spokes -->
        <g stroke-linecap="round">
          <!-- 3 Heavy Aero Composite Blades -->
          <path d="M -12 -25 L -6 -150 L 8 -150 L 12 -25 Z" fill="url(#gunmetalSpec)"/>
          <path d="M 27 2 L 133 70 L 125 82 L 16 18 Z" fill="url(#gunmetalSpec)"/>
          <path d="M -16 18 L -125 82 L -133 70 L -27 2 Z" fill="url(#gunmetalSpec)"/>
          <!-- Blade Accent Lines -->
          <line x1="0" y1="-35" x2="0" y2="-146" stroke="#8ea2ba" stroke-width="1.5"/>
          <line x1="30" y1="18" x2="125" y2="73" stroke="#8ea2ba" stroke-width="1.5"/>
          <line x1="-30" y1="18" x2="-125" y2="73" stroke="#8ea2ba" stroke-width="1.5"/>

          <!-- Secondary High-Tension Steel Spokes -->
          <line x1="0" y1="0" x2="106" y2="-106" stroke="#6d7f96" stroke-width="2.2"/>
          <line x1="0" y1="0" x2="-106" y2="-106" stroke="#6d7f96" stroke-width="2.2"/>
          <line x1="0" y1="0" x2="0" y2="150" stroke="#6d7f96" stroke-width="2.2"/>
          <line x1="0" y1="0" x2="144" y2="-40" stroke="#495668" stroke-width="1.6"/>
          <line x1="0" y1="0" x2="-144" y2="-40" stroke="#495668" stroke-width="1.6"/>
          <line x1="0" y1="0" x2="62" y2="136" stroke="#495668" stroke-width="1.6"/>
          <line x1="0" y1="0" x2="-62" y2="136" stroke="#495668" stroke-width="1.6"/>
        </g>

        <!-- Ventilated Disc Brake Rotor -->
        <circle cx="0" cy="0" r="54" fill="none" stroke="#9eb0c7" stroke-width="10" stroke-dasharray="18 6"/>
        <circle cx="0" cy="0" r="46" fill="none" stroke="#4e5d70" stroke-width="4"/>
        <circle cx="0" cy="0" r="32" fill="#18202b" stroke="#7d8fa6" stroke-width="2"/>
        <!-- Center Hub & Cyan Bearing Ring -->
        <circle cx="0" cy="0" r="20" fill="url(#gunmetalDark)" stroke="#c5d1de" stroke-width="2"/>
        <circle cx="0" cy="0" r="10" fill="#09131c" stroke="#00f0ff" stroke-width="2.5"/>
      </g>
    </defs>

    <!-- ========================================================================= -->
    <!-- 1. BACKGROUND: CYBERPUNK ELEVATED HIGHWAY & PARALLAX METROPOLIS           -->
    <!-- ========================================================================= -->
    <rect width="1600" height="900" fill="url(#skyGrad)"/>
    <ellipse cx="880" cy="580" rx="850" ry="380" fill="url(#cityGlow)"/>

    <!-- Atmospheric Horizon Grid & Distant Mega-Structures -->
    <g opacity="0.28">
      <line x1="0" y1="620" x2="1600" y2="620" stroke="#00f0ff" stroke-width="1" stroke-dasharray="12 24"/>
      <line x1="0" y1="520" x2="1600" y2="520" stroke="#3b526b" stroke-width="0.8" stroke-dasharray="4 16"/>
    </g>

    <!-- Parallax Layer 1: Far Skyline Silhouettes (Slowest) -->
    <g id="bgCityFar" fill="#09111f" stroke="#162640" stroke-width="1">
      <g id="cityFarStrip1">
        <path d="M 0 700 L 0 420 L 65 420 L 85 380 L 140 380 L 140 510 L 190 510 L 190 310 L 260 280 L 290 280 L 290 480 L 350 480 L 350 360 L 440 360 L 440 530 L 510 530 L 510 240 L 560 210 L 610 240 L 610 490 L 680 490 L 680 390 L 770 390 L 770 520 L 840 520 L 840 290 L 930 290 L 950 330 L 950 500 L 1030 500 L 1030 350 L 1120 350 L 1120 470 L 1190 470 L 1190 260 L 1270 260 L 1290 300 L 1290 510 L 1370 510 L 1370 400 L 1460 400 L 1460 490 L 1530 490 L 1530 370 L 1600 370 L 1600 700 Z"/>
        <!-- Distant Building Beacons & Vertical Window Strips -->
        <g fill="#00f0ff" opacity="0.32" stroke="none">
          <rect x="210" y="320" width="4" height="140"/>
          <rect x="224" y="320" width="4" height="140"/>
          <rect x="532" y="255" width="6" height="190"/>
          <rect x="865" y="320" width="4" height="150"/>
          <rect x="880" y="320" width="4" height="150"/>
          <rect x="1220" y="290" width="5" height="160"/>
        </g>
        <g fill="#ff4d29" opacity="0.55" stroke="none">
          <circle cx="260" cy="276" r="3"/>
          <circle cx="560" cy="206" r="3.5"/>
          <circle cx="885" cy="286" r="3"/>
          <circle cx="1230" cy="256" r="3"/>
        </g>
      </g>
      <use href="#cityFarStrip1" x="1600" y="0"/>
    </g>

    <!-- Parallax Layer 2: Midground Industrial Towers & Highway Pylons (Medium speed) -->
    <g id="bgPylonsMid">
      <g id="pylonStrip1">
        <!-- Truss Arch Support 1 -->
        <path d="M 120 710 L 165 450 L 230 450 L 275 710 Z" fill="#0d1624" stroke="#1e304a" stroke-width="2"/>
        <line x1="145" y1="570" x2="250" y2="570" stroke="#1e304a" stroke-width="3"/>
        <rect x="192" y="465" width="10" height="45" fill="#00f0ff" opacity="0.22"/>
        <!-- Overhead Highway Sign Gantry -->
        <path d="M 620 710 L 650 380 L 705 380 L 735 710 Z" fill="#0c1522" stroke="#223654" stroke-width="2"/>
        <rect x="642" y="410" width="72" height="18" fill="#132238" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
        <rect x="652" y="416" width="32" height="6" fill="#ff4d29" opacity="0.7"/>
        <!-- Truss Arch Support 2 -->
        <path d="M 1140 710 L 1185 430 L 1250 430 L 1295 710 Z" fill="#0d1624" stroke="#1e304a" stroke-width="2"/>
        <rect x="1212" y="450" width="10" height="60" fill="#00f0ff" opacity="0.22"/>
      </g>
      <use href="#pylonStrip1" x="1600" y="0"/>
    </g>

    <!-- Parallax Layer 3: High-Speed Guardrails & Track Stanchions (Fast) -->
    <g id="bgRailNear">
      <!-- Continuous Upper & Lower Guardrail Beams -->
      <rect x="0" y="656" width="1600" height="10" fill="#182334"/>
      <rect x="0" y="684" width="1600" height="14" fill="#121b28"/>
      <line x1="0" y1="658" x2="1600" y2="658" stroke="#394d68" stroke-width="1.5"/>
      <g id="railPosts">
        <!-- Repeated stanchions every 200px -->
        <path d="M 80 715 L 95 645 L 115 645 L 108 715 Z M 280 715 L 295 645 L 315 645 L 308 715 Z M 480 715 L 495 645 L 515 645 L 508 715 Z M 680 715 L 695 645 L 715 645 L 708 715 Z M 880 715 L 895 645 L 915 645 L 908 715 Z M 1080 715 L 1095 645 L 1115 645 L 1108 715 Z M 1280 715 L 1295 645 L 1315 645 L 1308 715 Z M 1480 715 L 1495 645 L 1515 645 L 1508 715 Z" fill="#202c3d" stroke="#0d131c" stroke-width="1.5"/>
        <!-- Reflective hazard markers on posts -->
        <path d="M 96 655 L 108 655 L 106 668 L 94 668 Z M 496 655 L 508 655 L 506 668 L 494 668 Z M 896 655 L 908 655 L 906 668 L 894 668 Z M 1296 655 L 1308 655 L 1306 668 L 1294 668 Z" fill="#ff4d29" opacity="0.75"/>
        <path d="M 296 655 L 308 655 L 306 668 L 294 668 Z M 696 655 L 708 655 L 706 668 L 694 668 Z M 1096 655 L 1108 655 L 1106 668 L 1094 668 Z M 1496 655 L 1508 655 L 1506 668 L 1494 668 Z" fill="#00f0ff" opacity="0.75"/>
      </g>
    </g>

    <!-- ========================================================================= -->
    <!-- 2. ELEVATED ROADWAY DECK, REFLECTIONS & CONTACT SHADOWS                   -->
    <!-- ========================================================================= -->
    <g id="roadLayer">
      <!-- Road Deck Surface -->
      <rect x="0" y="708" width="1600" height="192" fill="url(#roadDeckGrad)"/>
      <!-- Metal Expansion Curb Line -->
      <line x1="0" y1="708" x2="1600" y2="708" stroke="#3c516e" stroke-width="2"/>
      <line x1="0" y1="712" x2="1600" y2="712" stroke="#00f0ff" stroke-width="1" opacity="0.35"/>

      <!-- Scrolling Road Markings & Wet Asphalt Light Streaks -->
      <line id="roadStripeMain" x1="0" y1="752" x2="1600" y2="752" stroke="#00f0ff" stroke-width="3" stroke-dasharray="140 180" opacity="0.45"/>
      <line id="roadStripeHazard" x1="0" y1="818" x2="1600" y2="818" stroke="#ff4d29" stroke-width="4" stroke-dasharray="90 230" opacity="0.38"/>
      <line id="roadSlickStreak" x1="0" y1="776" x2="1600" y2="776" stroke="#78b8ff" stroke-width="1.5" stroke-dasharray="220 340" opacity="0.22"/>

      <!-- Ambient Ground Bounce Glow from Reactor, Gular Pouch & Thrusters -->
      <ellipse id="groundGlowReactor" cx="840" cy="755" rx="340" ry="26" fill="url(#cyanGroundBounce)"/>
      <ellipse id="groundGlowPouch" cx="1260" cy="755" rx="210" ry="20" fill="url(#cyanGroundBounce)"/>
      <ellipse id="groundGlowThruster" cx="320" cy="755" rx="260" ry="28" fill="url(#orangeGroundBounce)" opacity="0.45"/>

      <!-- Deep Contact Shadows directly beneath Rear Wheel (470,750), BB, and Front Wheel (1150,750) -->
      <ellipse cx="810" cy="754" rx="460" ry="18" fill="url(#wheelContactShadow)" opacity="0.65"/>
      <ellipse cx="470" cy="751" rx="145" ry="14" fill="url(#wheelContactShadow)"/>
      <ellipse cx="1150" cy="751" rx="145" ry="14" fill="url(#wheelContactShadow)"/>
    </g>

    <!-- Background Speed Lines (Subtle in cruise, intense in BOOST, never blocking subject) -->
    <g id="speedLinesBg" stroke-linecap="round">
      <line class="spd-line" x1="150" y1="140" x2="480" y2="140" stroke="#00f0ff" stroke-width="2" opacity="0.25"/>

<script>
(function () {
  "use strict";

  // ============================================================================
  // 1. KINEMATIC CONSTANTS & MECHANICAL GEOMETRY
  // ============================================================================
  const BB_X = 755;          // Bottom Bracket (Crank Center) X
  const BB_Y = 585;          // Bottom Bracket (Crank Center) Y
  const CRANK_R = 68;        // Crank Arm Radius (px)

  const BASE_HIP_X = 675;    // Pelican Hip Joint Base X
  const BASE_HIP_Y = 330;    // Pelican Hip Joint Base Y

  const L1 = 182;            // Upper Leg (Thigh / Tibiotarsus) Length (px)
  const L2 = 174;            // Lower Leg (Tarsometatarsus) Length (px)

  const RAD_TO_DEG = 180 / Math.PI;

  // DOM Elements - Left Leg & Crank (Far side)
  const leftCrankArm = document.getElementById("leftCrankArm");
  const leftCrankHighlight = document.getElementById("leftCrankHighlight");
  const leftThigh = document.getElementById("leftThigh");
  const leftShin = document.getElementById("leftShin");
  const leftFoot = document.getElementById("leftFoot");

  // DOM Elements - Right Leg & Crank (Near side)
  const rightCrankOuter = document.getElementById("rightCrankOuter");
  const rightCrankBody = document.getElementById("rightCrankBody");
  const rightCrankGroove = document.getElementById("rightCrankGroove");
  const rightThigh = document.getElementById("rightThigh");
  const rightShin = document.getElementById("rightShin");
  const rightFoot = document.getElementById("rightFoot");

  // DOM Elements - Synchronized Wheels & Drivetrain
  const rearWheelInstance = document.getElementById("rearWheelInstance");
  const frontWheelInstance = document.getElementById("frontWheelInstance");
  const chainringGroup = document.getElementById("chainringGroup");
  const rearCassette = document.getElementById("rearCassette");
  const chainLinksPath = document.getElementById("chainLinksPath");
  const chainInnerPinPath = document.getElementById("chainInnerPinPath");

  // DOM Elements - Secondary Motion & Mecha Sub-Assemblies
  const masterRig = document.getElementById("masterRig");
  const pelicanBodyGroup = document.getElementById("pelicanBodyGroup");
  const pelicanHeadGroup = document.getElementById("pelicanHeadGroup");
  const gularPouchGroup = document.getElementById("gularPouchGroup");
  const wingFeathersCluster = document.getElementById("wingFeathersCluster");
  const tailFeathersFan = document.getElementById("tailFeathersFan");
  const dorsalSpoilers = document.getElementById("dorsalSpoilers");
  const frontForkGroup = document.getElementById("frontForkGroup");
  const reactorBlades = document.getElementById("reactorBlades");
  const reactorGlowOrb = document.getElementById("reactorGlowOrb");
  const pouchEnergyOrb = document.getElementById("pouchEnergyOrb");
  const neckCableOuter = document.getElementById("neckCableOuter");
  const neckCableCyan = document.getElementById("neckCableCyan");

  // DOM Elements - Thrusters & Environment
  const mainTailFlame = document.getElementById("mainTailFlame");
  const bikeAuxFlame = document.getElementById("bikeAuxFlame");
  const groundGlowReactor = document.getElementById("groundGlowReactor");
  const groundGlowPouch = document.getElementById("groundGlowPouch");
  const groundGlowThruster = document.getElementById("groundGlowThruster");
  const bgCityFar = document.getElementById("bgCityFar");
  const bgPylonsMid = document.getElementById("bgPylonsMid");
  const railPosts = document.getElementById("railPosts");
  const roadStripeMain = document.getElementById("roadStripeMain");
  const roadStripeHazard = document.getElementById("roadStripeHazard");
  const roadSlickStreak = document.getElementById("roadSlickStreak");
  const sparkLayer = document.getElementById("sparkLayer");

  // Speed Line Elements
  const speedLinesBg = Array.from(document.querySelectorAll(".spd-line"));
  const speedLinesFg = Array.from(document.querySelectorAll(".spd-line-fg"));

  // HUD Controls
  const boostBtn = document.getElementById("boostBtn");
  const hudStatus = document.getElementById("hudStatus");

  // ============================================================================
  // 2. EXACT 2-BONE INVERSE KINEMATICS SOLVER (LAW OF COSINES)
  // ============================================================================
  /**
   * Computes knee position and bone angles so Hip -> Knee -> Pedal is exact.
   * Bends knee forward (clockwise from hip-to-pedal vector in screen coordinates).
   */
  function solve2BoneIK(hipX, hipY, pedalX, pedalY, l1, l2) {
    const dx = pedalX - hipX;
    const dy = pedalY - hipY;
    let dist = Math.hypot(dx, dy);

    // Clamp reach within physical bone limits
    const maxReach = l1 + l2 - 0.5;
    const minReach = Math.abs(l1 - l2) + 0.5;
    if (dist > maxReach) dist = maxReach;
    if (dist < minReach) dist = minReach;

    // Angle of direct line from Hip to Pedal
    const baseAngle = Math.atan2(dy, dx);

    // Law of Cosines for interior angle at Hip
    const cosAlpha = (l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist);
    const alpha = Math.acos(Math.max(-1, Math.min(1, cosAlpha)));

    // Knee bends forward (toward front of bike, which is smaller angle in screen Y-down coords)
    const thighAngleRad = baseAngle - alpha;
    const kneeX = hipX + l1 * Math.cos(thighAngleRad);
    const kneeY = hipY + l1 * Math.sin(thighAngleRad);

    // Shin angle from Knee to exact Pedal coordinates
    const shinAngleRad = Math.atan2(pedalY - kneeY, pedalX - kneeX);

    return {
      kneeX,
      kneeY,
      thighDeg: thighAngleRad * RAD_TO_DEG,
      shinDeg: shinAngleRad * RAD_TO_DEG
    };
  }

  // ============================================================================
  // 3. TIRE SPARK & SPEED LINE PARTICLE SYSTEM
  // ============================================================================
  const MAX_SPARKS = 22;
  const sparks = [];

  for (let i = 0; i < MAX_SPARKS; i++) {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("stroke-linecap", "round");
    sparkLayer.appendChild(line);
    sparks.push({
      el: line,
      x: 455,
      y: 748,
      vx: -400,
      vy: -80,
      life: Math.random(),
      maxLife: 0.25 + Math.random() * 0.35,
      isCyan: i % 3 === 0
    });
  }

  function resetSpark(s, boostFactor) {
    // Spawn near rear tire ground contact patch (450, 748)
    s.x = 455 + (Math.random() - 0.5) * 30;
    s.y = 748 + (Math.random() - 0.5) * 6;
    const speedMult = 1 + boostFactor * 1.35;
    s.vx = -(420 + Math.random() * 520) * speedMult;
    s.vy = -(45 + Math.random() * 190 * (1 + boostFactor * 0.6));
    s.life = 0;
    s.maxLife = 0.18 + Math.random() * 0.28;
    s.isCyan = Math.random() < (0.28 + boostFactor * 0.35);
  }

  // Initialize speed line data
  const allSpeedLines = [...speedLinesBg, ...speedLinesFg].map((el, idx) => ({
    el,
    x: Math.random() * 1600,
    y: parseFloat(el.getAttribute("y1")) || (120 + idx * 85),
    len: 180 + Math.random() * 260,
    speed: 1450 + Math.random() * 950,
    baseOpacity: idx < speedLinesBg.length ? 0.22 : 0.36
  }));

  // ============================================================================
  // 4. OVERDRIVE BOOST STATE MANAGEMENT
  // ============================================================================
  let boostEndTime = 0;
  let boostIntensity = 0; // Smoothly interpolated 0.0 -> 1.0

  function triggerBoost() {
    const now = performance.now();
    boostEndTime = now + 2100; // ~2.1 seconds of Overdrive
    boostBtn.classList.add("active");
    hudStatus.classList.add("boosting");
  }

  boostBtn.addEventListener("click", () => {
    triggerBoost();
    boostBtn.blur();
  });

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      triggerBoost();
    }
  });

  // ============================================================================
  // 5. MAIN ANIMATION LOOP (requestAnimationFrame)
  // ============================================================================
  let lastTime = performance.now();
  let crankTheta = 0.4;       // Crank angle in radians (increases = clockwise rotation)
  let wheelAngleDeg = 0;      // Wheel rotation in degrees (increases = clockwise rotation)
  let chainOffset = 0;        // Chain dash offset (decreases = clockwise travel)
  let cityFarOffset = 0;
  let pylonMidOffset = 0;
  let railNearOffset = 0;
  let roadDashOffset = 0;

  function animate(now) {
    const rawDt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    // Smoothly interpolate boostIntensity toward target (1 during boost, 0 in cruise)
    const isBoostActive = now < boostEndTime;
    if (!isBoostActive && boostBtn.classList.contains("active")) {
      boostBtn.classList.remove("active");
      hudStatus.classList.remove("boosting");
    }
    const targetBoost = isBoostActive ? 1.0 : 0.0;
    const lerpRate = isBoostActive ? 8.5 : 3.2;
    boostIntensity += (targetBoost - boostIntensity) * Math.min(1, rawDt * lerpRate);

    // Effective pedaling cadence & road speed multiplier
    const speedMultiplier = 1.0 + boostIntensity * 1.25;
    const omega = 6.4 * speedMultiplier; // Crank angular velocity (rad/s)
    crankTheta = (crankTheta + omega * rawDt) % (Math.PI * 2);

    // --------------------------------------------------------------------------
    // A. SYNCHRONIZED CLOCKWISE ROTATION: CRANK, WHEELS, CHAINRING & CHAIN
    // --------------------------------------------------------------------------
    // Gear ratio ~2.7x: wheels spin faster than crank, strictly clockwise (+)
    const crankDeltaDeg = (omega * rawDt) * RAD_TO_DEG;
    const wheelDeltaDeg = crankDeltaDeg * 2.75;
    wheelAngleDeg = (wheelAngleDeg + wheelDeltaDeg) % 360;

    rearWheelInstance.setAttribute("transform", `translate(470, 565) rotate(${wheelAngleDeg.toFixed(2)})`);
    frontWheelInstance.setAttribute("transform", `translate(1150, 565) rotate(${wheelAngleDeg.toFixed(2)})`);

    const crankDeg = (crankTheta * RAD_TO_DEG) % 360;
    chainringGroup.setAttribute("transform", `translate(755, 585) rotate(${crankDeg.toFixed(2)})`);
    rearCassette.setAttribute("transform", `translate(470, 565) rotate(${(wheelAngleDeg * 1.1).toFixed(2)})`);

    // Chain path goes clockwise: top run left->right, bottom run right->left.
    // Negative stroke-dashoffset advances dash pattern clockwise along the path!
    chainOffset = (chainOffset - omega * rawDt * 56) % 180;
    chainLinksPath.setAttribute("stroke-dashoffset", chainOffset.toFixed(2));
    chainInnerPinPath.setAttribute("stroke-dashoffset", chainOffset.toFixed(2));

    // --------------------------------------------------------------------------
    // B. SUSPENSION HEAVE & INERTIAL SECONDARY MOTION (2x Per Pedal Revolution)
    // --------------------------------------------------------------------------
    // Power stroke peaks twice per crank revolution (sin(2 * theta))
    const powerPulse = Math.sin(crankTheta * 2);
    const phaseLag1 = Math.sin(crankTheta * 2 - 0.65);
    const phaseLag2 = Math.sin(crankTheta * 2 - 1.35);

    // Body suspension heave & aggressive forward crouch during BOOST
    const bodyBobY = powerPulse * (3.8 + boostIntensity * 2.4) + boostIntensity * 5.5;
    const bodyShiftX = boostIntensity * 8.0 + Math.cos(crankTheta * 2) * 1.8;
    const bodyPitchDeg = powerPulse * 0.9 + boostIntensity * 2.4;

    pelicanBodyGroup.setAttribute(
      "transform",
      `translate(${bodyShiftX.toFixed(2)}, ${bodyBobY.toFixed(2)}) rotate(${bodyPitchDeg.toFixed(2)}, 755, 310)`
    );

    // Whole bike subtle road micro-vibration + suspension dip
    const rigHeaveY = Math.sin(crankTheta * 2 - 0.25) * 1.4;
    masterRig.setAttribute("transform", `translate(0, ${rigHeaveY.toFixed(2)})`);

    // Front fork micro-suspension compression
    const forkCompress = Math.max(-3.5, Math.min(3.5, powerPulse * 2.2 + boostIntensity * 1.8));
    frontForkGroup.setAttribute("transform", `translate(${(forkCompress * 0.38).toFixed(2)}, ${forkCompress.toFixed(2)})`);

    // Head aero-tuck stabilization & Gular Pouch inertial oscillation
    const headPitch = -bodyPitchDeg * 0.65 + phaseLag1 * 1.1 - boostIntensity * 1.2;
    pelicanHeadGroup.setAttribute("transform", `translate(1045, 138) rotate(${headPitch.toFixed(2)}, 20, 0)`);

    const pouchSwing = phaseLag2 * (2.2 + boostIntensity * 1.6);
    const pouchScaleY = 1.0 + Math.sin(crankTheta * 2 - 1.1) * 0.028;
    gularPouchGroup.setAttribute(
      "transform",
      `translate(35, 22) rotate(${pouchSwing.toFixed(2)}, 20, 0) scale(1, ${pouchScaleY.toFixed(3)})`
    );

    // Layered metallic wing feathers, tail feathers & dorsal spoilers inertial flutter
    const highFreqFlutter = Math.sin(now * 0.045) * boostIntensity * 1.6;
    const wingFeatherAngle = phaseLag1 * 2.6 + highFreqFlutter;
    wingFeathersCluster.setAttribute("transform", `translate(965, 275) rotate(${wingFeatherAngle.toFixed(2)})`);

    const tailFanAngle = phaseLag2 * 3.2 - boostIntensity * 2.5 + highFreqFlutter;
    tailFeathersFan.setAttribute("transform", `rotate(${tailFanAngle.toFixed(2)})`);

    const spoilerAngle = phaseLag1 * 2.8 + boostIntensity * 4.5;
    dorsalSpoilers.setAttribute("transform", `translate(740, 195) rotate(${spoilerAngle.toFixed(2)})`);

    // Neck hydraulic cable flexing via control point modulation
    const cableFlexY = 165 + phaseLag2 * 8;
    const cablePath = `M 955 215 C 930 ${cableFlexY.toFixed(1)}, 955 125, 1020 128`;
    neckCableOuter.setAttribute("d", cablePath);
    neckCableCyan.setAttribute("d", cablePath);

    // Chest Turbine Reactor Spin & Glow Pulsation
    const reactorSpinDeg = (now * (0.28 + boostIntensity * 0.65)) % 360;
    reactorBlades.setAttribute("transform", `rotate(${reactorSpinDeg.toFixed(1)})`);
    const corePulse = 1 + Math.sin(now * 0.015) * 0.08 + boostIntensity * 0.28;
    reactorGlowOrb.setAttribute("transform", `scale(${corePulse.toFixed(3)})`);
    pouchEnergyOrb.setAttribute("transform", `translate(135, 58) scale(${corePulse.toFixed(3)}) translate(-135, -58)`);

    // --------------------------------------------------------------------------
    // C. EXACT 2-BONE INVERSE KINEMATICS FOR RIGHT & LEFT LEGS
    // --------------------------------------------------------------------------
    // Current world-space Hip position (moves with pelicanBodyGroup)
    const currentHipX = BASE_HIP_X + bodyShiftX;
    const currentHipY = BASE_HIP_Y + bodyBobY;

    // 1. Right Crank & Right Leg (Angle = crankTheta)
    const rPedalX = BB_X + CRANK_R * Math.cos(crankTheta);
    const rPedalY = BB_Y + CRANK_R * Math.sin(crankTheta);

    rightCrankOuter.setAttribute("x2", rPedalX.toFixed(2));
    rightCrankOuter.setAttribute("y2", rPedalY.toFixed(2));
    rightCrankBody.setAttribute("x2", rPedalX.toFixed(2));
    rightCrankBody.setAttribute("y2", rPedalY.toFixed(2));
    rightCrankGroove.setAttribute("x2", rPedalX.toFixed(2));
    rightCrankGroove.setAttribute("y2", rPedalY.toFixed(2));

    const rIK = solve2BoneIK(currentHipX, currentHipY, rPedalX, rPedalY, L1, L2);
    rightThigh.setAttribute(
      "transform",
      `translate(${currentHipX.toFixed(2)}, ${currentHipY.toFixed(2)}) rotate(${rIK.thighDeg.toFixed(2)})`
    );
    rightShin.setAttribute(
      "transform",
      `translate(${rIK.kneeX.toFixed(2)}, ${rIK.kneeY.toFixed(2)}) rotate(${rIK.shinDeg.toFixed(2)})`
    );
    // Foot stays 100% locked to the pedal with natural ankle rocking
    const rAnkleDeg = Math.sin(crankTheta - 0.5) * 11;
    rightFoot.setAttribute(
      "transform",
      `translate(${rPedalX.toFixed(2)}, ${rPedalY.toFixed(2)}) rotate(${rAnkleDeg.toFixed(2)})`
    );

    // 2. Left Crank & Left Leg (Angle = crankTheta + PI, strictly 180 degrees opposite)
    const lTheta = crankTheta + Math.PI;
    const lPedalX = BB_X + CRANK_R * Math.cos(lTheta);
    const lPedalY = BB_Y + CRANK_R * Math.sin(lTheta);

    leftCrankArm.setAttribute("x2", lPedalX.toFixed(2));
    leftCrankArm.setAttribute("y2", lPedalY.toFixed(2));
    leftCrankHighlight.setAttribute("x2", lPedalX.toFixed(2));
    leftCrankHighlight.setAttribute("y2", lPedalY.toFixed(2));

    const lIK = solve2BoneIK(currentHipX - 10, currentHipY - 4, lPedalX, lPedalY, L1, L2);
    leftThigh.setAttribute(
      "transform",
      `translate(${(currentHipX - 10).toFixed(2)}, ${(currentHipY - 4).toFixed(2)}) rotate(${lIK.thighDeg.toFixed(2)})`
    );
    leftShin.setAttribute(
      "transform",
      `translate(${lIK.kneeX.toFixed(2)}, ${lIK.kneeY.toFixed(2)}) rotate(${lIK.shinDeg.toFixed(2)})`
    );
    const lAnkleDeg = Math.sin(lTheta - 0.5) * 11;
    leftFoot.setAttribute(
      "transform",
      `translate(${lPedalX.toFixed(2)}, ${lPedalY.toFixed(2)}) rotate(${lAnkleDeg.toFixed(2)})`
    );

    // --------------------------------------------------------------------------
    // D. THRUSTER PLASMA PLUMES & AMBIENT GROUND REFLECTION GLOW
    // --------------------------------------------------------------------------
    const flameJitter = 0.92 + Math.sin(now * 0.06) * 0.12 + Math.cos(now * 0.095) * 0.08;
    const mainFlameScaleX = (0.26 + boostIntensity * 1.15) * flameJitter;
    const mainFlameScaleY = 0.55 + boostIntensity * 0.65;
    mainTailFlame.setAttribute(
      "transform",
      `translate(500, 292) scale(${mainFlameScaleX.toFixed(3)}, ${mainFlameScaleY.toFixed(3)})`
    );
    mainTailFlame.setAttribute("opacity", (0.48 + boostIntensity * 0.52).toFixed(2));

    const auxFlameScaleX = (0.22 + boostIntensity * 1.05) * flameJitter;
    bikeAuxFlame.setAttribute(
      "transform",
      `translate(408, 563) scale(${auxFlameScaleX.toFixed(3)}, ${mainFlameScaleY.toFixed(3)})`
    );
    bikeAuxFlame.setAttribute("opacity", (0.42 + boostIntensity * 0.58).toFixed(2));

    // Ground bounce light modulation
    groundGlowReactor.setAttribute("opacity", (0.65 + boostIntensity * 0.35).toFixed(2));
    groundGlowPouch.setAttribute("opacity", (0.7 + boostIntensity * 0.3).toFixed(2));
    groundGlowThruster.setAttribute("opacity", (0.28 + boostIntensity * 0.68 * flameJitter).toFixed(2));

    // --------------------------------------------------------------------------
    // E. PARALLAX CYBERPUNK HIGHWAY, TIRE SPARKS & SPEED LINES
    // --------------------------------------------------------------------------
    cityFarOffset = (cityFarOffset - 95 * speedMultiplier * rawDt) % 1600;
    pylonMidOffset = (pylonMidOffset - 380 * speedMultiplier * rawDt) % 1600;
    railNearOffset = (railNearOffset - 920 * speedMultiplier * rawDt) % 400;
    roadDashOffset = (roadDashOffset + 1380 * speedMultiplier * rawDt) % 640;

    bgCityFar.setAttribute("transform", `translate(${cityFarOffset.toFixed(1)}, 0)`);
    bgPylonsMid.setAttribute("transform", `translate(${pylonMidOffset.toFixed(1)}, 0)`);
    railPosts.setAttribute("transform", `translate(${railNearOffset.toFixed(1)}, 0)`);

    roadStripeMain.setAttribute("stroke-dashoffset", roadDashOffset.toFixed(1));
    roadStripeHazard.setAttribute("stroke-dashoffset", (roadDashOffset * 1.1).toFixed(1));
    roadSlickStreak.setAttribute("stroke-dashoffset", (roadDashOffset * 0.85).toFixed(1));

    // Update Tire Friction Sparks
    const activeSparkRatio = 0.42 + boostIntensity * 0.58;
    const activeSparkCount = Math.floor(MAX_SPARKS * activeSparkRatio);

    for (let i = 0; i < MAX_SPARKS; i++) {
      const s = sparks[i];
      if (i >= activeSparkCount) {
        s.el.setAttribute("opacity", "0");
        continue;
      }
      s.life += rawDt;
      if (s.life >= s.maxLife) {
        resetSpark(s, boostIntensity);
      }
      // Gravity & bounce on road surface (Y = 750)
      s.vy += 460 * rawDt;
      s.x += s.vx * rawDt;
      s.y += s.vy * rawDt;
      if (s.y > 750) {
        s.y = 750;
        s.vy = -Math.abs(s.vy) * 0.45;
      }

      const progress = s.life / s.maxLife;
      const alpha = Math.max(0, 1 - progress);
      const tailX = s.x - s.vx * (0.026 + boostIntensity * 0.015);
      const tailY = s.y - s.vy * 0.022;

      s.el.setAttribute("x1", s.x.toFixed(1));
      s.el.setAttribute("y1", s.y.toFixed(1));
      s.el.setAttribute("x2", tailX.toFixed(1));
      s.el.setAttribute("y2", tailY.toFixed(1));
      s.el.setAttribute("stroke", s.isCyan ? "#78f8ff" : "#ff8533");
      s.el.setAttribute("stroke-width", (2.6 * (1 - progress * 0.5)).toFixed(1));
      s.el.setAttribute("opacity", alpha.toFixed(2));
    }

    // Update Speed Lines
    for (let i = 0; i < allSpeedLines.length; i++) {
      const sl = allSpeedLines[i];
      sl.x -= sl.speed * speedMultiplier * rawDt;
      const currentLen = sl.len * (1 + boostIntensity * 0.85);
      if (sl.x + currentLen < -50) {
        sl.x = 1620 + Math.random() * 250;
      }
      sl.el.setAttribute("x1", sl.x.toFixed(1));
      sl.el.setAttribute("x2", (sl.x + currentLen).toFixed(1));
      const lineAlpha = Math.min(0.85, sl.baseOpacity + boostIntensity * 0.42);
      sl.el.setAttribute("opacity", lineAlpha.toFixed(2));
    }

    requestAnimationFrame(animate);
  }

  // Initialize sparks and start immediately
  for (let i = 0; i < MAX_SPARKS; i++) {
    resetSpark(sparks[i], 0);
    sparks[i].life = Math.random() * sparks[i].maxLife;
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
