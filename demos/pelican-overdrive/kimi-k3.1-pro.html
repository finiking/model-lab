<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>PELICAN // OVERDRIVE</title>
<style>
  :root{color-scheme:dark;--cyan:#78efff;--orange:#ff6338}
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030608}
  body{display:grid;place-items:center;font-family:Consolas,"Liberation Mono",monospace}
  .stage{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);overflow:hidden;background:#070d13;isolation:isolate;--boost:0}
  svg{display:block;width:100%;height:100%;touch-action:manipulation}
  .brand{position:absolute;z-index:2;top:4.6%;left:4%;color:#d9e5e5;font-size:clamp(8px,1.05vw,16px);font-weight:600;letter-spacing:.25em;line-height:1;text-shadow:0 1px 8px #000;user-select:none;pointer-events:none}
  .brand::before{content:"";display:inline-block;width:1.8em;height:.36em;margin-right:1.1em;background:var(--orange);box-shadow:.55em 0 0 #52616a;vertical-align:.15em}
  #boost{position:absolute;z-index:3;right:3.6%;bottom:5.2%;appearance:none;border:1px solid #65818a;background:rgba(5,13,18,.78);color:#d9f5f5;padding:.85em 1.35em .78em;font:700 clamp(8px,.85vw,13px)/1 Consolas,"Liberation Mono",monospace;letter-spacing:.2em;cursor:pointer;clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,11px 100%,0 calc(100% - 11px));transition:color .18s,border-color .18s,background .18s,transform .18s;backdrop-filter:blur(5px)}
  #boost::before{content:"";display:inline-block;width:.52em;height:.52em;margin-right:.8em;background:#78efff;box-shadow:0 0 calc(5px + var(--boost)*12px) #45ddff;vertical-align:.04em}
  #boost:hover,#boost:focus-visible{outline:none;border-color:#a2f5ff;color:white;background:rgba(13,35,42,.9)}
  #boost:active{transform:translateY(1px)}
  #boost.active{color:#fff4e8;border-color:#ff8157;background:rgba(71,27,18,.82)}
  #boost.active::before{background:#ff7042;box-shadow:0 0 15px #ff532d}
  @media(max-aspect-ratio:4/3){.brand{font-size:clamp(7px,1.8vw,12px)}#boost{font-size:clamp(7px,1.5vw,11px)}}
</style>
</head>

<script>
(()=>{
'use strict';

let seed=731;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};

// Repeated skyline modules: no assets, and each layer follows a different parallax rate.
function city(id,base,count,color,windows,scale){

for(const id of ['rearSpokes','frontSpokes']){
  const g=$(id);for(let i=0;i<20;i++){const a=i*Math.PI/10,x=Math.cos(a)*136,y=Math.sin(a)*136;el('path',{d:`M${Math.cos(a+.16)*24} ${Math.sin(a+.16)*24}L${x} ${y}`,stroke:i%2?'#60747c':'#a1b1b2','stroke-width':i%2?1.6:2.2},g)}

const ids={};['bodyAssembly','rearSpin','frontSpin','rearCogSpin','chain','chainringSpin','nearCrankSpin','farCrankSpin','nearPedal','farPedal','nearUpper','nearLower','nearKnee','nearFoot','farUpper','farLower','farKnee','farFoot','nearLegCable','nearLegCableHi','farLegCable','nearWingUpper','nearWingLower','nearWingElbow','farWingUpper','farWingLower','farWingElbow','nearWingCable','pouchSpin','pouchGlow','chestSpin','chestGlow','eyeGlow','boostFlame','neckCable','neckCableHi','featherA','featherB','featherC','featherD','tailA','tailB','tailC','roadFlow','farCityA','farCityB','midCityA','midCityB','speedLines'].forEach(id=>ids[id]=$(id));
const tr=(n,x,y,a=0)=>n.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${a.toFixed(2)})`);
function ik(h,a,l1,l2,bend){
  const dx=a.x-h.x,dy=a.y-h.y,d=Math.max(Math.abs(l1-l2)+.01,Math.min(l1+l2-.01,Math.hypot(dx,dy))),ux=dx/d,uy=dy/d;

  const d=`M${hip.x} ${hip.y}Q${k.x-35} ${k.y-45} ${k.x} ${k.y}T${ankle.x} ${ankle.y}`;

const stage=$('stage'),button=$('boost');let phase=.65,distance=0,boostStart=-1e9,last=performance.now(),sparkCarry=0;

const smooth=(a,b,x)=>{const u=Math.max(0,Math.min(1,(x-a)/(b-a)));return u*u*(3-2*u)};

  const s=sparks.find(v=>v.life<=0);if(!s)return;const front=rnd()>.76;s.x=(front?1150:450)+rnd()*22;s.y=843+rnd()*7;s.vx=-170-rnd()*(270+b*280);s.vy=-45-rnd()*(120+b*80);s.life=s.max=.25+rnd()*.38;

  const deg=phase*rad,wheel=distance/164*rad,bob=Math.sin(phase*2)*3.1+Math.sin(now*.0021)*1.1;

  ids.rearSpin.setAttribute('transform',`rotate(${wheel.toFixed(2)})`);ids.frontSpin.setAttribute('transform',`rotate(${wheel.toFixed(2)})`);ids.rearCogSpin.setAttribute('transform',`rotate(${wheel.toFixed(2)})`);

  ids.tailA.setAttribute('transform',`rotate(${inertia*.65} 620 390)`);ids.tailB.setAttribute('transform',`rotate(${inertia*.9} 615 413)`);ids.tailC.setAttribute('transform',`rotate(${inertia*1.15} 625 430)`);

  ids.neckCable.setAttribute('d',neck);ids.neckCableHi.setAttribute('d',neck);
  ids.pouchSpin.setAttribute('transform',`rotate(${(now*.025).toFixed(2)})`);ids.chestSpin.setAttribute('transform',`rotate(${(-now*.04).toFixed(2)})`);

  ids.boostFlame.setAttribute('opacity',b.toFixed(2));ids.boostFlame.setAttribute('transform',`translate(525 424) scale(${(.25+b*.95).toFixed(3)} ${(.65+b*.35).toFixed(3)})`);
  const f=-(distance*.035%1600),m=-(distance*.085%1600);ids.farCityA.setAttribute('transform',`translate(${f} 0)`);ids.farCityB.setAttribute('transform',`translate(${f+1600} 0)`);ids.midCityA.setAttribute('transform',`translate(${m} 0)`);ids.midCityB.setAttribute('transform',`translate(${m+1600} 0)`);
  ids.roadFlow.setAttribute('transform',`translate(${-(distance%320)} 0)`);ids.speedLines.setAttribute('opacity',(.13+b*.7).toFixed(2));
  for(const l of lines){const x=1690-((distance*l.rate+l.off)%2200),len=l.len*(1+b*1.8);l.n.setAttribute('d',`M${x} ${l.y}h${len}`)}
  sparkCarry+=dt*(5+b*27);while(sparkCarry>1){spawnSpark(b);sparkCarry--}
